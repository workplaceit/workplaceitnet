name: Weekly SEO Automation

on:
  schedule:
    - cron: '0 9 * * 0'
  workflow_dispatch:

jobs:
  seo-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install anthropic requests

      - name: Run SEO Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          REPO: workplaceit/workplaceitnet
        run: python .github/scripts/seo_agent.py

      - name: Commit fixes
        run: |
          git config --local user.email "seo-agent@workplaceit.net"
          git config --local user.name "WIT SEO Agent"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes this week"
          else
            git commit -m "SEO Agent: Weekly fix $(date +'%Y-%m-%d')"
            git push
          fi
